<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>product</title>
</head>
<body class="product-page-body">
    <main class="product-page">
        <div class="product-shell">
            <div class="product-image-box">
                <img id="productimage" src="" alt="watch">
            </div>

            <div class="product-content">
                <span class="product-badge">Limited Edition</span>
                <h1 id="productname"></h1>
                <h2 id="productprice" class="product-price"></h2>
                <p id="productdescription" class="product-description"></p>

                <div class="product-details-box">
                    <h3>Product Details</h3>
                    <ul id="productfeatures" class="product-feature-list"></ul>
                </div>

                <div class="spec-grid">
                    <div class="spec-item">
                        <span class="spec-label">Material</span>
                        <strong id="spec-material"></strong>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Movement</span>
                        <strong id="spec-movement"></strong>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Case Size</span>
                        <strong id="spec-case"></strong>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Water Resist</span>
                        <strong id="spec-water"></strong>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Strap</span>
                        <strong id="spec-strap"></strong>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Warranty</span>
                        <strong id="spec-guarantee"></strong>
                    </div>
                </div>

                <button class="buy-button" type="button">شراء الآن</button>
            </div>
        </div>
    </main>

    <script src="product.js"></script>
</body>
</html>
